<script>
/* ========================================================================
   L戦国乙女5 業火を穿つ宿焔の双刃（オリンピア/平和・2026）
   設定判別＆実戦メモツール
   数値出典: なな徹ほか攻略サイトの解析値（メーカー一次情報ではない）
   方針: 全設定判明している値のみ推測に使用。設定1のみ判明の値は「参考表示」に留める。
   ======================================================================== */
var SETS=[1,2,3,4,5,6];
var SC={1:"#78909C",2:"#42A5F5",3:"#66BB6A",4:"#FFA726",5:"#EF5350",6:"#AB47BC"};
var WARI={1:97.9,2:98.9,3:101.0,4:106.2,5:111.1,6:114.9};
var ATX={1:359.5,2:350.8,3:332.5,4:302.8,5:281.0,6:262.9};
/* 巫女ポイント0pt到達時のCZ「乙女アタック」当選率（カンスケ滞在時を除く） */
var OTOME={1:.203,2:.214,3:.232,4:.247,5:.252,6:.257};
/* 戦国乙女ボーナス出現率（本機最大級・約4倍差） */
var SENBO={1:21206.7,2:15648.9,3:13143.5,4:8143.4,5:6427.6,6:5502.7};
/* 設定1のみ判明している参考値（推測には非加算） */
var REF1={kyokawa:36.8,honnoji:114.8,honWin:.50,kessen:.55,shutsujin:183.6,
          kenAT:.51,kenEnd:.70,kashin:.50,ougai:.55,shion:.614};
var CYC1=[.40,.40,.30,.30,.30,1.00]; /* 設定1の周期別AT期待度（3〜5周期は30%以上） */
/* 準確定示唆（※従来機種を参考＝一次解析でない）の重み。設定を切り捨てず強く傾ける */
var QPEN=0.2;
/* 準確定示唆の重みを何回ぶんまで効かせるか。⚠️ 無制限だと数回の観測で実質ハード制約になる */
var QUASI_CAP=2;

/* ===== イベント ===== */
var EVS=[
 {id:"at",l:"AT当選",s:"強カワラッシュ",c:"#ff4081",cat:"at"},
 /* ⚠️ 2026-10-19 廃止（ユーザー指示）: 「巫女pt 0pt到達」をイベントとして1件ずつ記録していたが、
    判別に要るのは【0pt到達回数】と【うち乙女アタック当選回数】の2つだけ。
    カウンタタブの mikoT / mikoH で足りるので、イベント入力は廃止してカウンタに一本化した。
    ⚠️ カンスケ滞在（当選率40.2%）とリールロック2段階契機は mikoT から除外すること（カウンタの説明に明記）。 */
 /* ⚠️ 2026-10-21 廃止（ユーザー指示）: 強カワチャンスをイベントとして1件ずつ記録していたが、
    設定1で **1/36.8** ＝ 8,000G なら**約200回**起こる。しかもループ状態で連続再当選する設計なので、
    1件ずつ履歴に積むのは現実的でない（実際、記録しても使われるのは bump("kyoN") の回数だけだった
    ＝イベントとカウンタで**同じものを二重に持っていた**）。
    → カウンタタブの kyoN / kyoHigh に一本化。巫女pt 0pt到達（2026-10-19）と同じ対処。 */
 {id:"senbo",l:"戦国乙女BONUS",c:"#ffd54f",cat:"senbo"},
 /* 2026-11-07（ユーザー指示）: 「乙女ストラップモードは AT当選・戦国乙女ボーナスなどと同じように
    ボタンにして、その中に各乙女を入れて」。状態タブの長い選択列（2026-10-21〜）は撤去し、
    ここから記録する。記録すると ST.strap（やめどき警告）と示唆タブの出現回数に**両方**入る。 */
 {id:"strap",l:"乙女ストラップ",s:"モード滞在",c:"#f06292",cat:"strap"},
 {id:"ryoran",l:"繚乱の刻",s:"前兆",c:"#ffab40",cat:"ryoran"},
 {id:"atcz",l:"AT中CZ",s:"本能寺 他",c:"#ce93d8",cat:"atcz"},
 /* 2026-11-16（ユーザー指示）: 「出陣ボーナスを独立させて、出陣ボーナス終了画面を記録できるよう」。
    もともと ATCZ_T の中の1種別だったが、出陣ボーナスは**CZではなく疑似ボーナス（上乗せ特化20G）**で、
    さらに**終了画面にスタンプ（可/吉/良/優/極）が出る＝設定域が一発で確定する**。
    CZ の中に埋めていると終了画面の欄を出せず、スタンプを示唆タブで手入力するしかなかった。
    → 独立イベントにして、終了画面を選べば示唆カウンタへ自動加算する（AT終了と同じ作り）。
    ⚠️ ATCZ_T からは**消した**（同じものを2か所から記録できる形は、この案件で3回事故っている
       ＝強カワチャンス/巫女pt/AT終了画面。片方だけ副作用があり、状態が静かに食い違う）。 */
 {id:"shutsujin",l:"出陣ボーナス",s:"上乗せ特化20G",c:"#ffa726",cat:"shutsujin"},
 {id:"atend",l:"AT終了",c:"#80cbc4",cat:"atend"},
 /* エンディングは1日に0〜数回なのでイベント記録が適する（強カワチャンスとは逆＝あちらは
    1/36.8 で何十回も出るのでカウンタにした）。ボイスを選ぶと示唆カウンタへ自動加算される。 */
 {id:"ending",l:"エンディング",s:"+2400枚到達",c:"#ffe082",cat:"ending"},
 {id:"ensh",l:"演出/示唆",c:"#9fa8da",cat:"enshutsu"},
 {id:"other",l:"その他",c:"#8899aa",cat:"other"}
];
var EVMAP={};EVS.forEach(function(e){EVMAP[e.id]=e});
/* EVS から削除した過去のイベント id → 表示名。
   ⚠️ これが無いと、昨日までに記録した履歴が **生の id（"kyokawa"）** のまま履歴タブに出る
      （buildTable の `ev?ev.l:esc(e.ev)` に落ちるため）。ユーザーのデータは消さないので、
      読めるようにしておく責任がこちらにある。 */
var EV_RETIRED={kyokawa:"強カワチャンス（記録方式を変更）"};
/* ⚠️ EN_RETIRED（退役した演出カテゴリ）は **STRAP の定義より後**に置いてある
   （opts:STRAP を参照するため。ここに書くと var の巻き上げで opts が undefined になる）。
   → `var STRAP=[...]` の直後を見ること。 */

/* ⚠️ 2026-10-19 是正（5サイト突合）:
   - **強カワチャンスは当選契機ではない**（規定G数を加算して周期到達を早めるだけ）→ 削除
   - **戦国乙女ボーナスは契機ではなく「AT初当り時の一部で突入する30Gの開始形態」** → 削除
     （AT初当たりの分子からは estimate() が senboN ぶんを除いている。そちらは正しい）
   - 実在するのに無かった **フリーズ / リールロック2段階** を追加 */
/* ⚠️ 周期別当選率(`stats()` の cycTry/cycHit)に数えるのは **cyc / tenjou / modoshi だけ**。
   乙女アタック・リールロック2段階・フリーズ・紫炎(自力)は**周期の抽選ではない**ので
   分母にも分子にも入れない（入れると周期別当選率が薄まる）。
   2026-11-21（ユーザー指示）: 「繚乱の刻・紫炎（自力）を追加。かつリールロック2段階や
   乙女アタックと同様に1周期当選は数えないこと」→ 白名簿に**足さない**ことで満たしている。 */
var AT_KIK=[{id:"cyc",l:"周期到達"},{id:"otome",l:"乙女アタック"},
 {id:"tenjou",l:"天井(999G/6周期)"},{id:"modoshi",l:"引き戻し(百花繚乱チャンス)"},
 {id:"shien",l:"繚乱の刻・紫炎(自力)",s:"周期当選には数えない"},
 {id:"lock2",l:"リールロック2段階"},{id:"freeze",l:"夢幻の如くフリーズ"},{id:"fumei",l:"不明"}];
/* 2026-11-21（ユーザー指示）: AT当選時に上位ATが当たることがあるので記録する。

  /* ⚠️ 2026-10-21 修正（敵対的監査の指摘）: 以前は**イベント種を見ずに** mai を合算していた。
     旧仕様の強カワチャンスは mai に**加算G数**を入れていたので（2026-10-21 にイベント廃止）、
     昨日までのユーザーは「獲得 N枚」と出力タブの枚数合計が**加算Gぶん過大**になる。
     → 枚数を入れていたイベント以外は合算しない。 */
  if(e.mai&&e.ev!=="kyokawa")s.mai+=parseInt(e.mai)||0}
 return s}

/* ============================================================ ベイズ推定 ============================================================ */
function estimate(){
 var ll={},i,s,reasons=[],conf=[],quasi=[],used=false,mask={};
 ALLCK.forEach(function(k){var v=parseInt(CC[k]);CC[k]=(isFinite(v)&&v>0)?v:0});  // 破損値の防御
 for(i=0;i<SETS.length;i++){ll[SETS[i]]=0;mask[SETS[i]]=true}
 function bino(succ,trials,rates,label){if(!trials)return;used=true;
  for(i=0;i<SETS.length;i++){s=SETS[i];var p=Math.min(.999,Math.max(.00002,rates[s]));ll[s]+=succ*Math.log(p)+(trials-succ)*Math.log(1-p);}
  reasons.push(label+" "+succ+"/"+trials);}
 var tG=totalG(),st=stats(),warnMiko=false;
 // AT初当たり
 var sbN=Math.min(CC.senboN||0,st.at);        // 戦国乙女BONUSはAT初当たりに含まれるため分子から除く
 var atX=st.at-sbN;
 if(tG>=1000&&atX>0){used=true;
  for(i=0;i<SETS.length;i++){s=SETS[i];var p=1/ATX[s];ll[s]+=atX*Math.log(p)+(tG-atX)*Math.log(1-p);}
  // ⚠️ 2026-10-19 是正: 表示は st.at（BONUS込み）で割っていたのに、尤度に使う分子は atX（BONUS除外）。
  //    AT3回・BONUS2回・3000G で「1/1000」と出るが実際に計算していたのは 1/3000 だった。
  reasons.push("AT初当たり 1/"+Math.round(tG/atX)+(sbN?"（BONUS"+sbN+"回は別計上）":""));}
 // 乙女アタック当選率（分母＝0pt到達回数）
 // ⚠️ 2026-10-19 是正: 以前は `mikoT>mikoH`（厳密不等号）だったため、**全部当選（10/10・1/1）を
 //    丸ごと捨てていた**。分母さえ入っていれば当選率は計算できる。
 //    警告を出すべきなのは「当選だけ記録して分母(0pt到達)を入れていない」ケース。
 if(CC.mikoT>0&&CC.mikoH<=CC.mikoT)bino(CC.mikoH,CC.mikoT,OTOME,"乙女アタック");
 else if(CC.mikoH>0&&CC.mikoT===0)warnMiko=true;
 // 戦国乙女ボーナス（分母＝通常総G）
 // ⚠️ 2026-10-19 是正: 以前は tG>=1000 だけで無条件に入れていたため、**何も記録していないのに
 //    ハマリG数を入れただけで推定が動き、設定1が最有力(19.8%)になっていた**（実測）。
 //    「0回」は『引けなかった』と『数えていない』を区別できない。1/21206〜1/5502 のレアイベントで
 //    3000Gの期待値は0.14回＝ほぼ無情報なのに、全設定に差がついていた。
 //    → **1回以上記録されているときだけ**証拠として使う。
 //    ⑧ label に回数を入れると bino 側の "succ/trials" と二重になるので外した。
 if(tG>=1000&&CC.senboN>0){var sb={};for(i=0;i<SETS.length;i++)sb[SETS[i]]=1/SENBO[SETS[i]];
  bino(Math.min(CC.senboN,tG),tG,sb,"戦国乙女BONUS");}
 // ハード制約（解析で確定している示唆）
 for(var k in MASKS){if(CC[k]>0){var mn=MASKS[k];
   for(i=0;i<SETS.length;i++)if(SETS[i]<mn)mask[SETS[i]]=false;
   conf.push(SIGLBL[k]);used=true;}}
 // 準確定（従来機種参考）
 // ⚠️ 2026-10-19 是正: 回数そのままで累乗していたため QPEN(0.2)^n となり、
 //    同じ準確定を3回見ると設定1が 3.85%→0.16%＝**実質ハード制約**になっていた。
 //    これは「従来機種参考」と自分で注記している弱い根拠には強すぎる。→ **上限2回**にする。
 if(USE_Q)for(var k2 in QUASI){if(CC[k2]>0){var mn2=QUASI[k2];used=true;
   var nq=Math.min(CC[k2],QUASI_CAP);
   for(i=0;i<SETS.length;i++){s=SETS[i];if(s<mn2)ll[s]+=nq*Math.log(QPEN);}
   quasi.push(SIGLBL[k2]+(CC[k2]>QUASI_CAP?("×"+CC[k2]+"→上限"+QUASI_CAP):""));}}
 // エンディングボイス（2026-10-21 新設）
 // ⚠️ 6サイト突合の**本機の一次情報**（12種が3サイトで完全一致）なので、
 //    USE_Q＝「従来機種参考」のトグルとは**独立**に常に効かせる（OFFで消えるべきものではない）。
 // ⚠️ ただし各サイトの表記は「濃厚」ではなく「示唆」なので **MASKS（ハード制約）にはしない**。
 //    QPEN で強く傾けるだけ。回数上限も QUASI_CAP に合わせる（同じ示唆の累乗で実質ハード化するのを防ぐ）。
 function edPen(key,test,label){if(!(CC[key]>0))return;used=true;
  var n=Math.min(CC[key],QUASI_CAP),j,st2;
  for(j=0;j<SETS.length;j++){st2=SETS[j];if(test(st2))ll[st2]+=n*Math.log(QPEN);}
  reasons.push("EDボイス "+label+(CC[key]>QUASI_CAP?("×"+CC[key]+"→上限"+QUASI_CAP):""));}
 /* ⚠️ 2026-10-21 修正（敵対的監査の指摘）: 以前は EV_MIN の**各キーに個別に** QPEN を掛けていた。
    QUASI_CAP はキー単位の上限なのでキー間には効かず、ev2〜ev5 を各1回見ただけで
    0.2^4＝設定1が実質0になり、「MASKS(ハード制約)に入れない」という設計判断が無意味化していた。
    「設定2以上」と「設定5以上」は**包含関係にある同じ情報**なので、**最も強い1つだけ**を採用する。 */
 var evTop=0,evTopKey=null;
 Object.keys(EV_MIN).forEach(function(key){
  if(CC[key]>0&&EV_MIN[key]>evTop){evTop=EV_MIN[key];evTopKey=key;}});
 if(evTopKey){
  edPen(evTopKey,function(x){return x<evTop},evTop>=6?"設定6":"設定"+evTop+"以上");
  var lower=Object.keys(EV_MIN).filter(function(k){return CC[k]>0&&k!==evTopKey});
  if(lower.length)reasons.push("（EDボイス他"+lower.length+"件は上位の示唆に含まれるため非加算）");}
 Object.keys(EV_PAR).forEach(function(key){var want=EV_PAR[key];
  edPen(key,function(x){return (want==="odd")!==(x%2===1)},want==="odd"?"奇数設定":"偶数設定");});
 Object.keys(EV_DEN).forEach(function(key){var dn=EV_DEN[key];
  edPen(key,function(x){return x===dn},"設定"+dn+"否定");});
 // 入力整合性
 var warn=[];
 if(CC.evOdd>0&&CC.evEven>0)warn.push("EDボイス: 奇数示唆と偶数示唆が両方あります（同じ設定では両立しません。設定変更をまたいでいないか確認してください）");
 if(CC.ev6>0&&CC.evOdd>0)warn.push("EDボイス: 「設定6」と「奇数設定」が同時に記録されています（設定6は偶数なので両立しません）");
 if(warnMiko)warn.push("乙女アタックの分母（0pt到達回数）が0です。当選だけでは当選率を計算できません（現在 "+CC.mikoH+"/"+CC.mikoT+"）");
 if(CC.mikoH>CC.mikoT)warn.push("乙女アタック当選 "+CC.mikoH+"回 > 0pt到達 "+CC.mikoT+"回");
 if(tG>0&&CC.senboN>tG)warn.push("戦国乙女BONUS "+CC.senboN+"回 > 総G "+tG+"（総G/ハマリの入力漏れの可能性）");
 if(CC.honW>CC.honT)warn.push("本能寺 勝利数 > 突入数");
 if(CC.kesW>CC.kesT)warn.push("決戦ノ刻 勝利数 > 突入数");
 /* ⚠️「↑うち」型のカウンタを足したらペアの検査も足す（2026-10-21 の監査で漏れを指摘された） */
 if(CC.kyoHigh>CC.kyoN)warn.push("強カワ HIGH "+CC.kyoHigh+"回 > 強カワ総数 "+CC.kyoN+"回");
 var noG=0;for(i=0;i<LOG.length;i++)if(LOG[i].ev==="at"&&!(parseInt(LOG[i].g)>0))noG++;
 if(noG)warn.push("G数未入力のAT記録 "+noG+"件（初当たりが過大評価されます）");
 // 確定示唆と数値データの矛盾チェック
 var freeBest=SETS[0],freeMax=-Infinity,allowMax=-Infinity;
 for(i=0;i<SETS.length;i++){s=SETS[i];if(ll[s]>freeMax){freeMax=ll[s];freeBest=s}
  if(mask[s]&&ll[s]>allowMax)allowMax=ll[s];}
 if(conf.length&&!mask[freeBest]&&(freeMax-allowMax)>3)
  /* ⚠️ 2026-10-21 文言修正: ll には EDボイスのペナルティも入っているので「数値データ」は不正確
     （監査の指摘）。ll を2本持たせるほどの価値は無いので、言い方を実態に合わせる。 */
  warn.push("記録全体（AT初当たり等の数値＋EDボイス）は設定"+freeBest+"を強く示しています。確定示唆の記録が正しいか確認してください");
 // softmax + マスク
 var any=false;for(i=0;i<SETS.length;i++)if(mask[SETS[i]])any=true;
 if(!any){for(i=0;i<SETS.length;i++)mask[SETS[i]]=true;}
 var mx=-Infinity;for(i=0;i<SETS.length;i++)if(mask[SETS[i]]&&ll[SETS[i]]>mx)mx=ll[SETS[i]];
 var ex={},z=0;for(i=0;i<SETS.length;i++){s=SETS[i];var v=mask[s]?Math.exp(ll[s]-mx):0;ex[s]=v;z+=v;}
 var post={};for(i=0;i<SETS.length;i++){s=SETS[i];post[s]=z?ex[s]/z:0}
 var best=SETS[0],bp=-1,esum=0,odd=0,even=0,hi=0;
 for(i=0;i<SETS.length;i++){s=SETS[i];if(post[s]>bp){bp=post[s];best=s}esum+=s*post[s];
  if(s%2)odd+=post[s];else even+=post[s];if(s>=4)hi+=post[s];}
 return {post:post,best:best,bestP:bp,exp:esum,odd:odd,even:even,hi:hi,used:used,
         reasons:reasons,conf:conf,quasi:quasi,mask:mask,any:any,warn:warn};}

   ⚠️ `bump` は addEntry の中の閉包（e.ck に積んで**削除時に戻す**ため）。必ず渡すこと。
   ⚠️ `k` が空のもの（なし／キャラ12種／見ていない）は**加算しない**。記録だけ残す。 */
/* ⚠️ 2026-11-21: 終了画面は**戦国乙女ボーナスと出陣ボーナスの両方**に出る
   （なな徹・DMMぱちタウンで確認）。だから種別で絞らない＝1本の実装を両方で共有する。
   ⚠️ 選択肢は**1画面＝1つ**。スタンプはキャラ絵の上に乗るので「キャラ」と「スタンプ」を
      別の選択肢にすると**同じ画面を2回数える**（初版の欠陥・ユーザー指摘）。 */
function addStamp(e,bump){
 if(!curOpt)return;
 var o=BNS_STAMP.filter(function(x){return x.id===curOpt})[0];
 if(!o)return;
 e.stamp=o.id;
 if(o.k)bump(o.k)}

 BNS_STAMP.forEach(function(o){h+='<button type="button" class="dt-b'+(curOpt===o.id?' s':'')
  +'" data-enopt="'+o.id+'">'+o.l+(o.s?'<small style="display:block;font-size:8px;opacity:.55">'+o.s+'</small>':'')+'</button>'});
 return h+'</div></div>'}

function buildNote(e){var b=[],f;
 if(e.kik){f=AT_KIK.filter(function(x){return x.id===e.kik})[0];if(f)b.push(f.l)}
 /* 2026-11-21: 上位AT。⚠️ 通常AT（id:""）は記録しないので、ここに出るのは上位だけ。 */
 if(e.rank){f=AT_RANK.filter(function(x){return x.id===e.rank})[0];
  b.push(f?("★"+f.l+(f.s?"("+f.s+")":"")):esc(e.rank))}
 /* 2026-11-21: 本能寺の当選契機。G数契機のときだけ数値を添える。 */
 if(e.czk){f=CZ_KIK.filter(function(x){return x.id===e.czk})[0];
  b.push("契機:"+(f?f.l:esc(e.czk))+(e.czg?("("+esc(e.czg)+"G)"):""))}
 if(e.cyc)b.push(e.cyc+"周期目");
 if(e.mode){f=MIKO_MODE.filter(function(x){return x.id===e.mode})[0];if(f)b.push(f.l)}
 if(e.type){f=ATCZ_T.concat(RYO_T,END_VOICE).filter(function(x){return x.id===e.type})[0];
  /* ⚠️ 2026-11-16: 出陣ボーナスを ATCZ_T から外したので、過去ログの type が見つからなくなる。
     無言で消さず OLD_TYPE で拾う（ストラップで同じ対処をしている）。 */
  b.push(f?(f.l+(f.h?"("+f.h+")":"")):(OLD_TYPE[e.type]||esc(e.type)))}
 /* エンディングのランプ／キャラ。⚠️ END_LAMP は汎用 e.res の候補に**入れていない**ので
    （下の MIKO_RES.concat(...) を見ること）、ここで出さないと表示が消える。 */
 if(e.ev==="ending"){if(e.lamp)b.push("ランプ:"+esc(e.lamp));
  if(e.edc)b.push("キャラ:"+esc(e.edc))}
 if(e.scr){f=ATEND_SCR.filter(function(x){return x.id===e.scr})[0];if(f)b.push("終了画面:"+f.l+"("+f.s+")")}
 /* 2026-11-16: ボーナス終了画面のスタンプ（戦国乙女ボーナス／出陣ボーナス） */
 if(e.stamp){f=BNS_STAMP.filter(function(x){return x.id===e.stamp})[0];
  /* ⚠️ 2026-11-21: 「スタンプ」の文字を**全部に付けてはいけない**（キャラを足したので
     「ノブナガスタンプ」になる）。スタンプ5種だけが sp:1 を持つ。 */
  b.push("終了画面:"+(f?(f.l+(f.sp?"スタンプ":"")+(f.s?"("+f.s+")":""))
   :(OLD_STAMP[e.stamp]||esc(e.stamp))))}
 /* 2026-11-07: ストラップイベント。⚠️ 存在しない10人を削除したので、過去ログの id が
    STRAP に無いことがある。その場合は id をそのまま出す（無言で消さない）。 */
 if(e.strap){f=STRAP.filter(function(x){return x.id===e.strap})[0];
  b.push("ストラップ:"+(f?f.l:esc(e.strap)+"（現在は選択肢になし）"))}
 if(e.czout){f=CZ_OUT.filter(function(x){return x.id===e.czout})[0];if(f)b.push(f.l)}
 /* ⚠️ KYO_RES（強カワチャンスの勝敗）は 2026-10-19 に廃止。代わりに内部状態 KYO_ST を見る。
    剣聖チャンスは ATCZ_RES2（成功/失敗）なので、そちらも候補に入れる。 */
 if(e.res){f=MIKO_RES.concat(KYO_ST,ATCZ_RES,ATCZ_RES2,RYO_RES).filter(function(x){return x.id===e.res&&x.l})[0];
  if(f)b.push(f.l)}
 if(e.encat){var g=ENSHUTSU.filter(function(x){return x.id===e.encat})[0];
  if(g){var o=g.opts.filter(function(x){return x.id===e.enopt})[0];b.push(g.l+"："+(o?o.l:e.enopt)+(o&&o.s?"("+o.s+")":""))}
  else if(EN_RETIRED[e.encat]){var rt=EN_RETIRED[e.encat];
   var ro=(rt.opts||[]).filter(function(x){return x.id===e.enopt})[0];
   b.push(rt.l+"："+(ro?ro.l:esc(e.enopt)));}}
 if(e.mai)b.push(/[GgＧ]/.test(String(e.mai))?String(e.mai):(e.mai+"枚"));
 if(e.note)b.push(esc(e.note));
 return b.join("　")}

 h+='<div style="font-size:10px;color:rgba(255,255,255,.35);margin-bottom:10px;line-height:1.6">L戦国乙女5 業火を穿つ宿焔の双刃（オリンピア／平和）設定判別まとめ。複数攻略サイトの解析値をもとにしています。各項目タップで開閉。</div>';

   else if(sec.custom==="senbo"){h+='<table class="itbl"><thead><tr><th>設定</th><th class="v">戦国乙女BONUS</th></tr></thead><tbody>';

   else{h+='<table class="itbl"><tbody>';

     h+='<tr><td>'+(lvl?'<span class="idot" style="background:'+SC[lvl]+'"></span>':'')+row[0]+'</td><td class="v">'+(lvl?'<span class="ibadge" style="background:'+SC[lvl]+'">'+row[1]+'</span>':row[1])+'</td></tr>';}

function rExp(){var ct=document.getElementById("ct"),E=estimate(),s=stats(),tG=totalG();
 var t="━━ 戦国乙女5 業火を穿つ宿焔の双刃 ━━\n"+new Date().toLocaleString("ja-JP")+"\n\n【推定】\n";
 if(E.used){t+="最有力: 設定"+E.best+" ("+(E.bestP*100).toFixed(0)+"%) / 期待値"+E.exp.toFixed(2)+"\n分布: ";
  for(var i=0;i<SETS.length;i++)t+="設"+SETS[i]+" "+((E.post[SETS[i]]||0)*100).toFixed(0)+"% ";t+="\n";
  t+="奇数"+(E.odd*100).toFixed(0)+"% / 偶数"+(E.even*100).toFixed(0)+"% / 設4以上"+(E.hi*100).toFixed(0)+"%\n";
  if(E.conf.length){var rem=[];SETS.forEach(function(x){if(E.mask[x])rem.push(x)});
   t+="★確定示唆: "+E.conf.join(" / ")+" → 残る設定 "+rem.join("・")+"\n";}
  if(E.quasi.length)t+="準確定示唆: "+E.quasi.join(" / ")+"\n";
  t+="根拠: "+E.reasons.join(" / ")+"\n";}else t+="データ不足\n";
 t+="\n【集計】通常総G:"+tG+"（現在のハマり"+(parseInt(HAMARI)||0)+"G含む）\n";
 if(tG>0&&s.at>0)t+="AT初当たり: 1/"+Math.round(tG/s.at)+" ("+s.at+"回)\n";
 if(CC.mikoT)t+="乙女アタック: "+CC.mikoH+"/"+CC.mikoT+" ("+rate(CC.mikoH,CC.mikoT)+"%)\n";
 if(CC.senboN)t+="戦国乙女ボーナス: "+CC.senboN+"回\n";
 if(CC.kyoN&&tG>0)t+="強カワチャンス: "+CC.kyoN+"回 = 1/"+(tG/CC.kyoN).toFixed(1)+" (設1基準1/36.8)\n";
 if(CC.honT)t+="本能寺の変: "+CC.honW+"/"+CC.honT+"\n";
 if(CC.kesT)t+="決戦ノ刻: "+CC.kesW+"/"+CC.kesT+"\n";
 var cy=[];for(var c=0;c<6;c++)if(s.cycTry[c]>0)cy.push((c+1)+"周期 "+s.cycHit[c]+"/"+s.cycTry[c]);
 if(cy.length)t+="周期別当選: "+cy.join(" / ")+"\n";
 if(s.mai)t+="獲得枚数合計: "+s.mai+"枚\n";
 /* ⚠️ 2026-11-07: 周期内G数・巫女ptの入力欄を撤去したので、出力からも外す
    （欄が無いのに「周期内0G / 巫女pt-」と出ると、入れ忘れたのか欄が無いのか判らない）。 */
 t+="\n【状態】"+((parseInt(ST.cyc)||1))+"周期目 / ストラップ"+((STRAP.filter(function(x){return x.id===ST.strap})[0]||{l:"-"}).l)+(ST.tbl?" / 推定テーブル"+ST.tbl:"")+"\n";
 if(ST.shop||ST.dai)t+="【台】"+ST.shop+" "+ST.dai+"\n";
 var _t=parseInt(ST.toshi)||0,_k=parseInt(ST.kaishu)||0;
 if(_t||_k)t+="【収支】投資"+_t+"円 / 回収"+_k+"円 / 差引"+((_k-_t>=0?"+":"")+(_k-_t))+"円\n";
 if(ST.memo)t+="【メモ】\n"+ST.memo+"\n";
 t+="\n【タイムライン】\n";
 for(var j=0;j<LOG.length;j++){var e=LOG[j],ev=EVMAP[e.ev];
  var gF=(e.ev==="at"&&e.g)?e.g+"G":"-";
  t+=gF+"　"+(ev?ev.l:e.ev)+"　"+buildNote(e).replace(/<[^>]+>/g,"")+"\n";}
 ct.innerHTML='<div class="exp"><div class="exp-h">長押し→すべて選択→コピー</div><textarea class="exp-ta" id="eTA" readonly>'+t.replace(/</g,"&lt;")+'</textarea></div>';
 var ta=document.getElementById("eTA");if(ta){ta.focus();ta.setSelectionRange(0,ta.value.length)}}

/* ===== アクション ===== */
function addEntry(){if(!canAdd())return;var e={ev:curEv,ck:[]},ev=EVMAP[curEv];
 function bump(k){if(k in CC){CC[k]++;e.ck.push(k)}}
 if(ev.cat==="at"){e.kik=curKik;e.cyc=curCyc;e.g=String(parseInt(HAMARI)||0);HAMARI="";
  if(curRank)e.rank=curRank;   /* 2026-11-21: 上位AT（真・強カワラッシュ）を記録 */
  e.prev={tbl:ST.tbl,cyc:ST.cyc,cycG:ST.cycG,miko:ST.miko};
  ST.cyc=1;ST.cycG="";ST.miko="";}
 /* ⚠️ 2026-10-19 廃止: 巫女pt 0pt到達のイベント記録。カウンタ mikoT/mikoH に一本化した */
 if(ev.cat==="senbo"){bump("senboN");addStamp(e,bump);}
 /* 2026-11-16: 出陣ボーナス（独立イベント）。上乗せの記録＋終了画面のスタンプ。
    ⚠️ カウンタは必ず bump() を通す。直接 CC[k]++ すると e.ck に積まれず、
       記録を消しても示唆タブのカウントが戻らない。 */
 if(ev.cat==="shutsujin"){if(curMai)e.mai=curMai;addStamp(e,bump);}
 if(ev.cat==="atcz"){e.type=curType;if(curRes)e.res=curRes;if(curMai)e.mai=curMai;
  /* 2026-11-21: 本能寺の当選契機。⚠️ G数は契機が「G数」のときだけ残す（それ以外は嘘になる） */
  if(curType==="honnoji"&&curCzk){e.czk=curCzk;if(curCzk==="game"&&curCzg)e.czg=curCzg;}
  if(curType==="honnoji"){bump("honT");if(curRes==="win")bump("honW");}
  if(curType==="kessen"){bump("kesT");if(curRes==="win")bump("kesW");}}
 if(ev.cat==="ryoran"){e.type=curType;e.res=curRes;
  bump(curType==="shien"?"shiT":"enbT");if(curRes==="at")bump(curType==="shien"?"shiW":"enbW");
  e.prev={tbl:ST.tbl,cyc:ST.cyc,cycG:ST.cycG,miko:ST.miko};
  if(curRes==="at")ST.cyc=1;else ST.cyc=Math.min(ceilCyc(),(parseInt(ST.cyc)||1)+1);
  ST.cycG="";}   // 周期が進むのは繚乱の刻
 if(ev.cat==="atend"){if(curMai)e.mai=curMai;
  if(curOpt){e.scr=curOpt;var so=ATEND_SCR.filter(function(x){return x.id===curOpt})[0];
   e.prev={tbl:ST.tbl,cyc:ST.cyc,cycG:ST.cycG,miko:ST.miko};   // 削除時に巻き戻すため直前の状態を保存
   ST.tbl=(so&&so.tbl)?so.tbl:"";ST.cyc=1;ST.cycG="";}}
 if(ev.cat==="ending"){if(curType){e.type=curType;bump(curType);}
  if(curLamp)e.lamp=curLamp;if(curEdc)e.edc=curEdc;}
 if(ev.cat==="enshutsu"){e.encat=curCat;e.enopt=curOpt;}
 /* 2026-11-07: ストラップは「状態（ST.strap）」と「出現回数（示唆タブ）」の両方に効かせる。
    ⚠️ 削除で巻き戻せるよう prev に strap も入れる（入れないと消しても滞在が残る）。 */
 if(ev.cat==="strap"){e.strap=curOpt;
  e.prev={tbl:ST.tbl,cyc:ST.cyc,cycG:ST.cycG,miko:ST.miko,strap:ST.strap};
  ST.strap=curOpt;
  bump("s"+curOpt.charAt(0).toUpperCase()+curOpt.slice(1));}
 if(curNote)e.note=curNote;
 LOG.push(e);
 curEv=null;curG="";curKik=null;curCyc=null;curRes=null;curMode=null;curType=null;curMai="";curNote="";curCat=null;curOpt=null;curCzout=null;curEdc=null;curLamp="";curRank=null;curCzk=null;curCzg="";
 save();render()}

function doRst(){if(!rstP){rstP=true;if(rstT)clearTimeout(rstT);rstT=setTimeout(function(){rstP=false;render()},3000);render();return}
 LOG=[];initC();HAMARI="";save();rstP=false;render()}

document.getElementById("W").addEventListener("click",function(ev){var el=ev.target;
 for(var i=0;i<6&&el&&el!==this;i++){if(el.dataset){
  if(el.dataset.tab){TAB=el.dataset.tab;render();return}
  if(el.dataset.ev){curEv=(curEv===el.dataset.ev?null:el.dataset.ev);
   curKik=null;curCyc=null;curRes=null;curMode=null;curType=null;curMai="";curCat=null;curOpt=null;curCzout=null;curEdc=null;curLamp="";curRank=null;curCzk=null;curCzg="";
   curG="";render();return}   /* ⚠️ 旧: AT選択時に HAMARI を curG へコピーしていた（二重管理） */
  if(el.dataset.kik!==undefined){curKik=(curKik===el.dataset.kik?null:el.dataset.kik);render();return}
  if(el.dataset.cyc!==undefined){curCyc=(curCyc===+el.dataset.cyc?null:+el.dataset.cyc);render();return}
  if(el.dataset.mode!==undefined){curMode=(curMode===el.dataset.mode?null:el.dataset.mode);render();return}
  if(el.dataset.type!==undefined){curType=(curType===el.dataset.type?null:el.dataset.type);render();return}
  if(el.dataset.res!==undefined){curRes=(curRes===el.dataset.res?null:el.dataset.res);curCzout=null;render();return}
  if(el.dataset.czout!==undefined){curCzout=(curCzout===el.dataset.czout?null:el.dataset.czout);render();return}
  if(el.dataset.encat!==undefined){curCat=(curCat===el.dataset.encat?null:el.dataset.encat);curOpt=null;render();return}
  if(el.dataset.enopt!==undefined){curOpt=(curOpt===el.dataset.enopt?null:el.dataset.enopt);render();return}
  if(el.dataset.edc!==undefined){curEdc=(curEdc===el.dataset.edc?null:el.dataset.edc);render();return}
  if(el.dataset.rank!==undefined){curRank=(curRank===el.dataset.rank?null:el.dataset.rank);render();return}
  /* ⚠️ 契機を「レア役」等に変えたら G数はクリアする（G数以外なのに数値が残ると嘘になる） */
  if(el.dataset.czk!==undefined){curCzk=(curCzk===el.dataset.czk?null:el.dataset.czk);
   if(curCzk!=="game")curCzg="";render();return}
  if(el.dataset.a==="add"){addEntry();return}
  if(el.dataset.del!==undefined){var rm=LOG.splice(parseInt(el.dataset.del),1)[0];
   if(rm&&rm.ck)rm.ck.forEach(function(k){if(CC[k]>0)CC[k]--});
   if(rm&&rm.prev){ST.tbl=rm.prev.tbl;ST.cyc=rm.prev.cyc;ST.cycG=rm.prev.cycG;if("miko" in rm.prev)ST.miko=rm.prev.miko;
    if("strap" in rm.prev)ST.strap=rm.prev.strap;}   /* 2026-11-07: ストラップも巻き戻す */
   save();render();return}
  if(el.dataset.stcyc!==undefined){ST.cyc=+el.dataset.stcyc;save();render();return}
  if(el.dataset.clrstrap!==undefined){ST.strap="";save();render();return}
  if(el.dataset.tbl!==undefined){ST.tblId=el.dataset.tbl;save();render();return}
  if(el.dataset.mode2!==undefined){ST.mode=el.dataset.mode2;save();render();return}
  if(el.dataset.reset!==undefined){ST.reset=(ST.reset==="1"?"0":"1");save();render();return}
  if(el.dataset.clrtbl!==undefined){ST.tbl="";save();render();return}
  if(el.dataset.tgl){USE_Q=!USE_Q;save();render();return}
  if(el.dataset.tog){COL[el.dataset.tog]=!COL[el.dataset.tog];render();return}
  if(el.dataset.itog){infoCol[el.dataset.itog]=!infoCol[el.dataset.itog];render();return}
  if(el.dataset.ci){CC[el.dataset.ci]++;save();render();return}
  if(el.dataset.cd){if(CC[el.dataset.cd]>0)CC[el.dataset.cd]--;save();render();return}
 }el=el.parentElement}});
document.getElementById("W").addEventListener("input",function(ev){
 if(ev.target.id==="iH"){HAMARI=ev.target.value;save();rEst();rQS();
  var g=document.querySelector(".gtot b");if(g)g.textContent=totalG();return}
 /* iG（AT専用G入力）は 2026-10-19 に廃止。G数は上のハマりG欄（HAMARI）に一本化 */
 if(ev.target.id==="iN")curNote=ev.target.value;
 if(ev.target.id==="iMai")curMai=ev.target.value;
 if(ev.target.id==="iCzg")curCzg=ev.target.value;
 if(ev.target.id==="iLamp")curLamp=ev.target.value;
 var mp={iCycG:"cycG",iMiko:"miko",mShop:"shop",mDai:"dai",mToshi:"toshi",mKaishu:"kaishu",mMemo:"memo"};
 if(mp[ev.target.id]){ST[mp[ev.target.id]]=ev.target.value;save();
  if(ev.target.id==="mToshi"||ev.target.id==="mKaishu"){var t=parseInt(ST.kaishu)-parseInt(ST.toshi);}}});

load();render();
