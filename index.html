function estimate(){

 ALLCK.forEach(function(k){var v=parseInt(CC[k]);CC[k]=(isFinite(v)&&v>0)?v:0});  // 破損値の防御
 for(i=0;i<SETS.length;i++){ll[SETS[i]]=0;mask[SETS[i]]=true}
 function bino(succ,trials,rates,label){if(!trials)return;used=true;
  for(i=0;i<SETS.length;i++){s=SETS[i];var p=Math.min(.999,Math.max(.00002,rates[s]));ll[s]+=succ*Math.log(p)+(trials-succ)*Math.log(1-p);}
  reasons.push(label+" "+succ+"/"+trials);}
 var tG=totalG(),st=stats(),warnMiko=false;
 // AT初当たり
 var sbN=Math.min(CC.senboN||0,st.at);        // 戦国乙女BONUSはAT初当たりに含まれるため分子から除く
 var atX=st.at-sbN;
 if(tG>=1000&&atX>0){used=true;
  for(i=0;i<SETS.length;i++){s=SETS[i];var p=1/ATX[s];ll[s]+=atX*Math.log(p)+(tG-atX)*Math.log(1-p);}
  // ⚠️ 2026-10-19 是正: 表示は st.at（BONUS込み）で割っていたのに、尤度に使う分子は atX（BONUS除外）。
  //    AT3回・BONUS2回・3000G で「1/1000」と出るが実際に計算していたのは 1/3000 だった。
  reasons.push("AT初当たり 1/"+Math.round(tG/atX)+(sbN?"（BONUS"+sbN+"回は別計上）":""));}
 // 乙女アタック当選率（分母＝0pt到達回数）
 // ⚠️ 2026-10-19 是正: 以前は `mikoT>mikoH`（厳密不等号）だったため、**全部当選（10/10・1/1）を
 //    丸ごと捨てていた**。分母さえ入っていれば当選率は計算できる。
 //    警告を出すべきなのは「当選だけ記録して分母(0pt到達)を入れていない」ケース。
 if(CC.mikoT>0&&CC.mikoH<=CC.mikoT)bino(CC.mikoH,CC.mikoT,OTOME,"乙女アタック");
 else if(CC.mikoH>0&&CC.mikoT===0)warnMiko=true;
 // 戦国乙女ボーナス（分母＝通常総G）
 // ⚠️ 2026-10-19 是正: 以前は tG>=1000 だけで無条件に入れていたため、**何も記録していないのに
 //    ハマリG数を入れただけで推定が動き、設定1が最有力(19.8%)になっていた**（実測）。

 if(tG>=1000&&CC.senboN>0){var sb={};for(i=0;i<SETS.length;i++)sb[SETS[i]]=1/SENBO[SETS[i]];
  bino(Math.min(CC.senboN,tG),tG,sb,"戦国乙女BONUS");}
 // ハード制約（解析で確定している示唆）
 for(var k in MASKS){if(CC[k]>0){var mn=MASKS[k];
   for(i=0;i<SETS.length;i++)if(SETS[i]<mn)mask[SETS[i]]=false;
   conf.push(SIGLBL[k]);used=true;}}
 // 準確定（従来機種参考）
 // ⚠️ 2026-10-19 是正: 回数そのままで累乗していたため QPEN(0.2)^n となり、
 //    同じ準確定を3回見ると設定1が 3.85%→0.16%＝**実質ハード制約**になっていた。
 //    これは「従来機種参考」と自分で注記している弱い根拠には強すぎる。→ **上限2回**にする。
 if(USE_Q)for(var k2 in QUASI){if(CC[k2]>0){var mn2=QUASI[k2];used=true;
   var nq=Math.min(CC[k2],QUASI_CAP);
   for(i=0;i<SETS.length;i++){s=SETS[i];if(s<mn2)ll[s]+=nq*Math.log(QPEN);}
   quasi.push(SIGLBL[k2]+(CC[k2]>QUASI_CAP?("×"+CC[k2]+"→上限"+QUASI_CAP):""));}}
 // 入力整合性
 var warn=[];
 if(warnMiko)warn.push("乙女アタックの分母（0pt到達回数）が0です。当選だけでは当選率を計算できません（現在 "+CC.mikoH+"/"+CC.mikoT+"）");

 var freeBest=SETS[0],freeMax=-Infinity,allowMax=-Infinity;
 for(i=0;i<SETS.length;i++){s=SETS[i];if(ll[s]>freeMax){freeMax=ll[s];freeBest=s}

 if(e.type){f=ATCZ_T.concat(RYO_T).filter(function(x){return x.id===e.type})[0];if(f)b.push(f.l)}
 if(e.scr){f=ATEND_SCR.filter(function(x){return x.id===e.scr})[0];if(f)b.push("終了画面:"+f.l+"("+f.s+")")}

 if(e.res){f=MIKO_RES.concat(KYO_ST,ATCZ_RES,ATCZ_RES2,RYO_RES).filter(function(x){return x.id===e.res&&x.l})[0];
  if(f)b.push(f.l)}
 if(e.encat){var g=ENSHUTSU.filter(function(x){return x.id===e.encat})[0];

   if(sec.note)h+='<div class="inote">'+sec.note+'</div>';
   h+='</div>';}
  h+='</div>';}
 h+='</div>';ct.innerHTML=h}

function rExp(){var ct=document.getElementById("ct"),E=estimate(),s=stats(),tG=totalG();
 var t="━━ 戦国乙女5 業火を穿つ宿焔の双刃 ━━\n"+new Date().toLocaleString("ja-JP")+"\n\n【推定】\n";
 if(E.used){t+="最有力: 設定"+E.best+" ("+(E.bestP*100).toFixed(0)+"%) / 期待値"+E.exp.toFixed(2)+"\n分布: ";
  for(var i=0;i<SETS.length;i++)t+="設"+SETS[i]+" "+((E.post[SETS[i]]||0)*100).toFixed(0)+"% ";t+="\n";
  t+="奇数"+(E.odd*100).toFixed(0)+"% / 偶数"+(E.even*100).toFixed(0)+"% / 設4以上"+(E.hi*100).toFixed(0)+"%\n";
  if(E.conf.length){var rem=[];SETS.forEach(function(x){if(E.mask[x])rem.push(x)});
   t+="★確定示唆: "+E.conf.join(" / ")+" → 残る設定 "+rem.join("・")+"\n";}
  if(E.quasi.length)t+="準確定示唆: "+E.quasi.join(" / ")+"\n";
  t+="根拠: "+E.reasons.join(" / ")+"\n";}else t+="データ不足\n";
 t+="\n【集計】通常総G:"+tG+"（現在のハマり"+(parseInt(HAMARI)||0)+"G含む）\n";
 if(tG>0&&s.at>0)t+="AT初当たり: 1/"+Math.round(tG/s.at)+" ("+s.at+"回)\n";
 if(CC.mikoT)t+="乙女アタック: "+CC.mikoH+"/"+CC.mikoT+" ("+rate(CC.mikoH,CC.mikoT)+"%)\n";
 if(CC.senboN)t+="戦国乙女ボーナス: "+CC.senboN+"回\n";
 if(CC.kyoN&&tG>0)t+="強カワチャンス: "+CC.kyoN+"回 = 1/"+(tG/CC.kyoN).toFixed(1)+" (設1基準1/36.8)\n";
 if(CC.honT)t+="本能寺の変: "+CC.honW+"/"+CC.honT+"\n";
 if(CC.kesT)t+="決戦ノ刻: "+CC.kesW+"/"+CC.kesT+"\n";
 var cy=[];for(var c=0;c<6;c++)if(s.cycTry[c]>0)cy.push((c+1)+"周期 "+s.cycHit[c]+"/"+s.cycTry[c]);
 if(cy.length)t+="周期別当選: "+cy.join(" / ")+"\n";
 if(s.mai)t+="獲得枚数合計: "+s.mai+"枚\n";
 t+="\n【状態】"+((parseInt(ST.cyc)||1))+"周期目 / 周期内"+(parseInt(ST.cycG)||0)+"G / 巫女pt"+(ST.miko||"-")+" / ストラップ"+ST.strap+(ST.tbl?" / 推定テーブル"+ST.tbl:"")+"\n";
 if(ST.shop||ST.dai)t+="【台】"+ST.shop+" "+ST.dai+"\n";
 var _t=parseInt(ST.toshi)||0,_k=parseInt(ST.kaishu)||0;
 if(_t||_k)t+="【収支】投資"+_t+"円 / 回収"+_k+"円 / 差引"+((_k-_t>=0?"+":"")+(_k-_t))+"円\n";
 if(ST.memo)t+="【メモ】\n"+ST.memo+"\n";
 t+="\n【タイムライン】\n";
 for(var j=0;j<LOG.length;j++){var e=LOG[j],ev=EVMAP[e.ev];
  var gF=(e.ev==="at"&&e.g)?e.g+"G":"-";
  t+=gF+"　"+(ev?ev.l:e.ev)+"　"+buildNote(e).replace(/<[^>]+>/g,"")+"\n";}
 ct.innerHTML='<div class="exp"><div class="exp-h">長押し→すべて選択→コピー</div><textarea class="exp-ta" id="eTA" readonly>'+t.replace(/</g,"&lt;")+'</textarea></div>';
 var ta=document.getElementById("eTA");if(ta){ta.focus();ta.setSelectionRange(0,ta.value.length)}}

/* ===== アクション ===== */
function addEntry(){if(!canAdd())return;var e={ev:curEv,ck:[]},ev=EVMAP[curEv];
 function bump(k){if(k in CC){CC[k]++;e.ck.push(k)}}
 if(ev.cat==="at"){e.kik=curKik;e.cyc=curCyc;e.g=String(parseInt(HAMARI)||0);HAMARI="";
  e.prev={tbl:ST.tbl,cyc:ST.cyc,cycG:ST.cycG,miko:ST.miko};
  ST.cyc=1;ST.cycG="";ST.miko="";}
 /* ⚠️ 2026-10-19 廃止: 巫女pt 0pt到達のイベント記録。カウンタ mikoT/mikoH に一本化した */
 if(ev.cat==="kyokawa"){if(curRes)e.res=curRes;if(curMai)e.mai=curMai;bump("kyoN");}
 if(ev.cat==="senbo"){bump("senboN");}
 if(ev.cat==="atcz"){e.type=curType;if(curRes)e.res=curRes;if(curMai)e.mai=curMai;
  if(curType==="honnoji"){bump("honT");if(curRes==="win")bump("honW");}
  if(curType==="kessen"){bump("kesT");if(curRes==="win")bump("kesW");}}
 if(ev.cat==="ryoran"){e.type=curType;e.res=curRes;
  bump(curType==="shien"?"shiT":"enbT");if(curRes==="at")bump(curType==="shien"?"shiW":"enbW");
  e.prev={tbl:ST.tbl,cyc:ST.cyc,cycG:ST.cycG,miko:ST.miko};
  if(curRes==="at")ST.cyc=1;else ST.cyc=Math.min(ceilCyc(),(parseInt(ST.cyc)||1)+1);
  ST.cycG="";}   // 周期が進むのは繚乱の刻
 if(ev.cat==="atend"){if(curMai)e.mai=curMai;
  if(curOpt){e.scr=curOpt;var so=ATEND_SCR.filter(function(x){return x.id===curOpt})[0];
   e.prev={tbl:ST.tbl,cyc:ST.cyc,cycG:ST.cycG,miko:ST.miko};   // 削除時に巻き戻すため直前の状態を保存
   ST.tbl=(so&&so.tbl)?so.tbl:"";ST.cyc=1;ST.cycG="";}}
 if(ev.cat==="enshutsu"){e.encat=curCat;e.enopt=curOpt;}
 if(curNote)e.note=curNote;
 LOG.push(e);
 curEv=null;curG="";curKik=null;curCyc=null;curRes=null;curMode=null;curType=null;curMai="";curNote="";curCat=null;curOpt=null;curCzout=null;
 save();render()}

function doRst(){if(!rstP){rstP=true;if(rstT)clearTimeout(rstT);rstT=setTimeout(function(){rstP=false;render()},3000);render();return}
 LOG=[];initC();HAMARI="";save();rstP=false;render()}

document.getElementById("W").addEventListener("click",function(ev){var el=ev.target;
 for(var i=0;i<6&&el&&el!==this;i++){if(el.dataset){
  if(el.dataset.tab){TAB=el.dataset.tab;render();return}
  if(el.dataset.ev){curEv=(curEv===el.dataset.ev?null:el.dataset.ev);
   curKik=null;curCyc=null;curRes=null;curMode=null;curType=null;curMai="";curCat=null;curOpt=null;curCzout=null;
   curG="";render();return}   /* ⚠️ 旧: AT選択時に HAMARI を curG へコピーしていた（二重管理） */
  if(el.dataset.kik!==undefined){curKik=(curKik===el.dataset.kik?null:el.dataset.kik);render();return}
  if(el.dataset.cyc!==undefined){curCyc=(curCyc===+el.dataset.cyc?null:+el.dataset.cyc);render();return}
  if(el.dataset.mode!==undefined){curMode=(curMode===el.dataset.mode?null:el.dataset.mode);render();return}
  if(el.dataset.type!==undefined){curType=(curType===el.dataset.type?null:el.dataset.type);render();return}
  if(el.dataset.res!==undefined){curRes=(curRes===el.dataset.res?null:el.dataset.res);curCzout=null;render();return}
  if(el.dataset.czout!==undefined){curCzout=(curCzout===el.dataset.czout?null:el.dataset.czout);render();return}
  if(el.dataset.encat!==undefined){curCat=(curCat===el.dataset.encat?null:el.dataset.encat);curOpt=null;render();return}
  if(el.dataset.enopt!==undefined){curOpt=(curOpt===el.dataset.enopt?null:el.dataset.enopt);render();return}
  if(el.dataset.a==="add"){addEntry();return}
  if(el.dataset.del!==undefined){var rm=LOG.splice(parseInt(el.dataset.del),1)[0];
   if(rm&&rm.ck)rm.ck.forEach(function(k){if(CC[k]>0)CC[k]--});
   if(rm&&rm.prev){ST.tbl=rm.prev.tbl;ST.cyc=rm.prev.cyc;ST.cycG=rm.prev.cycG;if("miko" in rm.prev)ST.miko=rm.prev.miko;}
   save();render();return}
  if(el.dataset.stcyc!==undefined){ST.cyc=+el.dataset.stcyc;save();render();return}
  if(el.dataset.strap!==undefined){ST.strap=el.dataset.strap;save();render();return}
  if(el.dataset.tbl!==undefined){ST.tblId=el.dataset.tbl;save();render();return}
  if(el.dataset.mode2!==undefined){ST.mode=el.dataset.mode2;save();render();return}
  if(el.dataset.reset!==undefined){ST.reset=(ST.reset==="1"?"0":"1");save();render();return}
  if(el.dataset.clrtbl!==undefined){ST.tbl="";save();render();return}
  if(el.dataset.tgl){USE_Q=!USE_Q;save();render();return}
  if(el.dataset.tog){COL[el.dataset.tog]=!COL[el.dataset.tog];render();return}
  if(el.dataset.itog){infoCol[el.dataset.itog]=!infoCol[el.dataset.itog];render();return}
  if(el.dataset.ci){CC[el.dataset.ci]++;save();render();return}
  if(el.dataset.cd){if(CC[el.dataset.cd]>0)CC[el.dataset.cd]--;save();render();return}
 }el=el.parentElement}});
document.getElementById("W").addEventListener("input",function(ev){
 if(ev.target.id==="iH"){HAMARI=ev.target.value;save();rEst();rQS();
  var g=document.querySelector(".gtot b");if(g)g.textContent=totalG();return}
 /* iG（AT専用G入力）は 2026-10-19 に廃止。G数は上のハマりG欄（HAMARI）に一本化 */
 if(ev.target.id==="iN")curNote=ev.target.value;
 if(ev.target.id==="iMai")curMai=ev.target.value;
 var mp={iCycG:"cycG",iMiko:"miko",mShop:"shop",mDai:"dai",mToshi:"toshi",mKaishu:"kaishu",mMemo:"memo"};
 if(mp[ev.target.id]){ST[mp[ev.target.id]]=ev.target.value;save();
  if(ev.target.id==="mToshi"||ev.target.id==="mKaishu"){var t=parseInt(ST.kaishu)-parseInt(ST.toshi);}}});

load();render();
</script>
